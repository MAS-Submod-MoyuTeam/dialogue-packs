# Generated by RezeHub. Copy this file to .github/workflows/rezehub-notify.yml in your repository.
#
# It tells RezeHub that a new release exists, so the mod page updates within
# seconds instead of waiting for the periodic check.
#
# This repository relies on GitHub's source archive: when a release has no
# usable ZIP asset, RezeHub imports its zipball instead, so no file name
# pattern is needed here. (Several unmatched ZIPs stay ambiguous and are
# skipped.) The rules below record that fallback.
# RezeHub matches the repository it is bound to, so the file contains no
# secret.
name: Notify RezeHub

on:
  release:
    # `published` fires only when a release actually goes out. `created` would
    # also fire for drafts, which have no downloadable assets yet.
    types: [published]

# Nothing is written back to this repository.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify RezeHub of the release
        continue-on-error: true
        env:
          # No file name pattern is set: this repository takes the Release
          # source archive recorded below.
          # A literal block keeps backslashes exact: inside this JSON, "\d" is
          # a regex digit class, and no YAML quoting layer may touch it.
          REZEHUB_RULES: |-
            {"shared_source_code":true}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H 'Content-Type: application/json' \
            --data "{\"owner\":\"${GITHUB_REPOSITORY%/*}\",\"repo\":\"${GITHUB_REPOSITORY#*/}\",\"version\":\"${GITHUB_REF_NAME}\",\"rules\":${REZEHUB_RULES}}" \
            "http://rezehub.0721play.icu/api/v1/github-release-notify"
